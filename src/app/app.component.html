<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay">
      <ion-content>
        <ion-list id="inbox-list">
          <div class="menu-header">
            <ion-avatar>
              <img
                alt="Logo CoroApp"
                src="../assets/icon/favicon.png" />
            </ion-avatar>
            <h2>CoroApp</h2>
            <p>¡Bienvenido!</p>
          </div>

          <ion-menu-toggle
            auto-hide="false"
            *ngFor="let p of appPages; let i = index">
            <ion-item
              routerDirection="root"
              [routerLink]="[p.url]"
              lines="none"
              detail="false"
              routerLinkActive="selected">
              <ion-icon
                aria-hidden="true"
                slot="start"
                [ios]="p.icon + '-outline'"
                [md]="p.icon + '-sharp'"></ion-icon>
              <ion-label>{{ p.title }}</ion-label>
            </ion-item>
          </ion-menu-toggle>
          
          <ion-item lines="none" class="update-item">
            <ion-icon slot="start" ios="moon-outline" md="moon-sharp"></ion-icon>
            <ion-label>Modo Oscuro</ion-label>
            <ion-toggle slot="end" [(ngModel)]="isDarkMode" (ionChange)="onDarkModeChange()"></ion-toggle>
          </ion-item>
          
          <ion-item lines="none" (click)="checkUpdate()" button detail="false" class="update-item">
            <ion-icon slot="start" ios="cloud-download-outline" md="cloud-download-sharp"></ion-icon>
            <ion-label>Actualizar App</ion-label>
          </ion-item>
        </ion-list>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
