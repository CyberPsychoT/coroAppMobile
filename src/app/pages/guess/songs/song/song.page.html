<app-nav-bar></app-nav-bar>

<ion-content>
  <div class="contenido">
    
    <!-- Skeleton Loaders -->
    <ion-list lines="none" class="list-visualizer" *ngIf="isLoading">
      <ng-container *ngFor="let item of [1,2,3]">
        <ion-item color="light" class="song-header">
          <ion-skeleton-text animated style="width: 40%; height: 20px;"></ion-skeleton-text>
        </ion-item>
        <div>
          <div class="song-item" style="padding: 10px 15px;">
            <ion-skeleton-text animated style="width: 100%; height: 16px; margin-bottom: 8px;"></ion-skeleton-text>
            <ion-skeleton-text animated style="width: 80%; height: 16px; margin-bottom: 8px;"></ion-skeleton-text>
            <ion-skeleton-text animated style="width: 90%; height: 16px; margin-bottom: 8px;"></ion-skeleton-text>
            <ion-skeleton-text animated style="width: 60%; height: 16px; margin-bottom: 8px;"></ion-skeleton-text>
          </div>
        </div>
      </ng-container>
    </ion-list>

    <!-- Real Content -->
    <ion-list lines="none" class="list-visualizer" *ngIf="!isLoading">
      <ng-container *ngFor="let section of sections">
        <ion-item
          color="light"
          button
          (click)="section.open = !section.open"
          class="song-header animate-fade-in-up"
          [class.has-content]="section.content?.trim()"
          [class.no-content]="!section.content?.trim()">
          <ion-label class="ion-text-wrap">{{ section.name }}</ion-label>
          <ion-icon
            slot="end"
            name="chevron-down-outline"
            class="section-chevron"
            [class.open]="section.open"
            [class.pulse-icon]="!section.content?.trim()">
          </ion-icon>
        </ion-item>
        <div class="section-body" [class.open]="section.open">
          <div class="song-item" [innerHTML]="section.parsedContent"></div>
        </div>
      </ng-container>
    </ion-list>
  </div>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed" *ngIf="songIds.length > 0">
    <ion-fab-button (click)="nextSong()" color="secondary" [disabled]="currentIndex === songIds.length - 1">
      <ion-icon name="arrow-forward"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <ion-fab vertical="bottom" horizontal="start" slot="fixed" *ngIf="songIds.length > 0">
    <ion-fab-button (click)="prevSong()" color="secondary" [disabled]="currentIndex === 0">
      <ion-icon name="arrow-back"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
